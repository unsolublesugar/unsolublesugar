name: Deploy View Counter

# view-counter/ に変更があった master への push と手動実行のみ。
# PR（特に fork からのもの）ではデプロイしない＝Secrets を渡さない。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "view-counter/**"
      - ".github/workflows/view-counter.yml"

jobs:
  deploy:
    name: Deploy View Counter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        working-directory: view-counter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
